apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: htw-tutor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: <your-dockerhub-username>/htw-auth-service:latest
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/htw_auth"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: htw-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: htw-tutor
spec:
  selector:
    app: auth-service
  ports:
    - port: 4001
      targetPort: 4001
