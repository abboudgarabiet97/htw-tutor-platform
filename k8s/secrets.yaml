# Replace the placeholder values before applying, or create the secret
# imperatively instead, e.g.:
# kubectl create secret generic htw-secrets \
#   --namespace htw-tutor \
#   --from-literal=JWT_SECRET=your-secret \
#   --from-literal=CLOUDINARY_CLOUD_NAME=your-cloud-name \
#   --from-literal=CLOUDINARY_API_KEY=your-api-key \
#   --from-literal=CLOUDINARY_API_SECRET=your-api-secret
apiVersion: v1
kind: Secret
metadata:
  name: htw-secrets
  namespace: htw-tutor
type: Opaque
stringData:
  JWT_SECRET: "change-me"
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
